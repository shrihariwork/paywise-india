name: Security & SAST Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  audit:
    name: Dependency Audit & Zero-PCI Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm audit --audit-level=high || true
      - name: Verify Zero-PCI Compliance
        run: |
          echo "Scanning for sensitive card patterns (PAN, CVV, PIN)..."
          ! grep -rE "([0-9]{4}[- ]?){3}[0-9]{4}" src/ || (echo "Sensitive PAN pattern detected in src/" && exit 1)
          echo "Zero-PCI Scan Passed: No card numbers detected."
